<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" width="256" height="256">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Circle background -->
  <circle cx="128" cy="128" r="120" fill="none" stroke="#0ea5e9" stroke-width="3" filter="url(#glow)"/>
  
  <!-- File shape with neon effect -->
  <g filter="url(#glow)">
    <!-- File outline -->
    <path d="M 80 40 L 130 40 L 150 60 L 150 200 L 60 200 L 60 40 Z" 
          fill="none" stroke="#06b6d4" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    
    <!-- Top corner fold -->
    <path d="M 130 40 L 150 60" 
          stroke="#06b6d4" stroke-width="4" stroke-linecap="round"/>
    <path d="M 130 40 L 130 60 L 150 60" 
          stroke="#06b6d4" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    
    <!-- Center diamond circle design -->
    <circle cx="105" cy="130" r="20" 
            fill="none" stroke="#06b6d4" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Diamond around circle -->
    <path d="M 105 95 L 140 130 L 105 165 L 70 130 Z" 
          fill="none" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>